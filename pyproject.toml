[project]
name = "nano-gpt"
version = "0.1.0"
description = "nano-gpt experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "modal>=1.5.3",
    "python-dotenv>=1.0.1",
    "pyarrow>=17.0.0",
    "regex>=2024.1.1",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
]

[project.scripts]
nanogpt-train = "nanogpt.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanogpt"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.3",
]
